name: Cross Platform Build

# Jab bhi aap main branch par code 'push' karenge, yeh automatic chalega
on:
  push:
    branches: [ "main" ]

jobs:
  build-ubuntu:
    runs-on: ubuntu-20.04
    
    steps:
    # 1. Aapka code cloud computer mein copy karega
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Cloud computer mein Python setup karega
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # 3. Dependencies aur PyInstaller install karega
    - name: Install PyInstaller
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        # Agar aapki script mein koi aur library hai toh yahan likhein, jaise:
        # pip install requests

    # 4. PyInstaller se executable banayega
    - name: Build with PyInstaller
      run: |
        pyinstaller --onefile main.py

    # 5. Output file ko GitHub par upload karega
    - name: Upload Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CLI-Build-ubuntu-20.04
        path: dist/

  build-windows:
    needs: build-ubuntu
    runs-on: windows-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install PyInstaller
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    - name: Build with PyInstaller
      run: |
        pyinstaller --onefile main.py

    - name: Upload Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CLI-Build-windows-latest
        path: dist/

  build-macos:
    needs: build-windows
    runs-on: macos-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install PyInstaller
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    - name: Build with PyInstaller
      run: |
        pyinstaller --onefile main.py

    - name: Upload Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CLI-Build-macos-latest
        path: dist/
